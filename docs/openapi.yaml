openapi: 3.1.0
info:
  title: GPS API
  version: 1.0.0
  description: API for gps coordinates

servers:
  - url: http://localhost:12003
    description: Local server

paths:
  /healthz:
    get:
      summary: Check service health
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

components:
  parameters:
    RequestIdHeader:
      name: X-REQUEST-ID
      in: header
      required: true
      description: Unique request identifier
      schema:
        type: string
